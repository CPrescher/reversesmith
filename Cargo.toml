[package]
name = "rsmith"
version = "1.4.0"
edition = "2021"
description = "Reverse Monte Carlo structure refinement against scattering data"
license = "MIT"
repository = "https://github.com/CPrescher/rsmith"
homepage = "https://github.com/CPrescher/rsmith"
readme = "README.md"
keywords = ["rmc", "scattering", "structure", "xray", "neutron"]
categories = ["science", "simulation"]

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rustfft = "6"

[features]
default = []
gap-quip = []
