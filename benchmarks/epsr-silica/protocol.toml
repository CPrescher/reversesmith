# Preregistered comparison design for the canonical EPSR26 silica exercise.
# Do not change outcome definitions after rsmith results have been inspected.

[provenance]
reference_program = "EPSR26"
reference_package = "EPSR_WorkedExamples_2022/DTBsilicaNX from the local EPSR26 installation"
manual = "EPSR26 Manual 2019-11-27, section 8.3"
official_page = "https://www.isis.stfc.ac.uk/Pages/Empirical-Potential-Structure-Refinement.aspx"

[provenance.amendment_2026_08_03]
reason = "The local DTBsilicaNX worked input supersedes assumptions transcribed from the manual. This amendment was made before stochastic rsmith refinement results were generated."
changes = [
  "number density 0.06834 -> file-derived 0.0663999705 atoms/A^3",
  "neutron nrtype 3 -> worked-input nrtype 5",
  "reference package identified by file hashes rather than unavailable ZIP",
]

[provenance.amendment_2026_08_03_ambient_models]
reason = "Two pre-existing 300 K GAP and Pedone model endpoints were registered before any multi-epoch stochastic rsmith silica reproduction or superiority result was generated."
source_repository = "CPrescher/SiO2_glass"
source_commit = "b05590846c87eb58cf1ed2e09a6787c1d67f9e53"
changes = [
  "add the GAP-quenched and Pedone-only endpoints as secondary structural reference models",
  "freeze a 2.2 A Si-O coordination cutoff plus angle and shortest-ring diagnostics",
  "prohibit treating closeness to either model as the primary physical-superiority criterion",
]

[provenance.amendment_2026_08_03_cross_recovery]
reason = "The symmetric GAP/Pedone cross-start recovery design was frozen before inspecting any cross-refinement outcome."
protocol = "expected/cross-recovery.toml"
changes = [
  "replace pathological random starts with the opposite plausible model endpoint",
  "isotropically rescale the cross-start to the hidden target density without relaxation",
  "require zero-move forward controls and common independent coordinate scoring for every program",
  "classify PDFgui as a forward-only control because it is not an atomistic RMC engine",
]

[provenance.amendment_2026_08_03_observable_audit]
reason = "EPSR source and output inspection established that .u01 is the calculated total while .v01 is data-minus-model. The older reference-potential smoke target was corrected and rerun before publication use."
changes = [
  "read calculated tutorial totals from DTBsilica.EPSR.u01 rather than residuals from .v01",
  "retain .v01 only for residual scoring or reconstructing a native forward curve as input minus residual",
]

[provenance.amendment_2026_08_03_public_gap]
reason = "The private structure repository did not contain the potential; the published Erhard silica GAP was imported from its primary Zenodo record under an archive checksum gate."
doi = "10.5281/zenodo.6353684"
archive_md5 = "6a16de69b5e17fd18160d9b55972a3e1"
xml_label = "GAP_2021_4_19_120_7_32_55_336"

[provenance.amendment_2026_08_03_hrmc_weight_pilot]
reason = "A bounded Pedone/GAP weight grid and its selection rules were frozen before any sweep outcomes were scored."
protocol = "expected/hrmc-weight-sweep.toml"
changes = [
  "add same-seed, same-start, 1000-move pure-RMC and energy-weight controls in both cross-recovery directions",
  "require at least half of pure-RMC neutron and X-ray fit progress and enforce the existing minimum-distance constraints",
  "use the pilot only to bracket matched 6000-move production weights, not to claim MLIP superiority",
]

[provenance.amendment_2026_08_03_gap_cliff_followup]
reason = "The coarse GAP pilot left an unresolved acceptance cliff between weights 0.3 and 1.0; the linear follow-up grid and worst-direction selection rule were frozen before its outcomes were scored."
protocol = "expected/hrmc-gap-cliff-followup.toml"
changes = [
  "test GAP weights 0.4, 0.5, 0.6, and 0.8 under the unchanged 1000-move pilot",
  "select the largest weight that retains at least half of pure-RMC neutron and X-ray progress in both symmetric directions",
]

[provenance.amendment_2026_08_03_pace2024]
reason = "The public Erhard-2024 ACE source, independent energy oracle, and PACE weight grids were frozen before their refinement outcomes were scored."
source_protocol = "expected/pace2024-oracle.toml"
weight_protocols = ["expected/hrmc-pace2024-weight-pilot.toml", "expected/hrmc-pace2024-weight-followup.toml"]
changes = [
  "add native PACE as an MLIP-HRMC implementation control alongside GAP/QUIP",
  "require official-python-ace agreement before refinement",
  "select a low/knee/high PACE weight bracket using the same symmetric 50-percent progress guard",
]

[provenance.amendment_2026_08_03_joint_production]
reason = "The selected Pedone/GAP/PACE grids and joint-acceptance protocol were frozen before the matched 6000-move outcomes were scored."
protocol = "expected/hrmc-production-unscreened.toml"
superseded_protocol = "expected/hrmc-production-bracket.toml"
changes = [
  "retain the 0-of-6000 GAP delayed-acceptance result as a failed optimization gate",
  "compare all three regularizers with one joint Metropolis test on delta_chi2 plus weighted delta_energy",
  "restrict the single-seed result to implementation, calibration, and throughput claims",
]

[provenance.amendment_2026_08_03_next_campaign_scope]
reason = "After the matched single-seed diagnostic, external GAP/QUIP was removed from further replicas because of cost; its completed results remain an archived implementation control."
protocol = "expected/next-campaign-scope.toml"
changes = [
  "focus multi-seed refinement on pure RMC, Pedone weight 3, native PACE weight 3, rsmith EPSR, native EPSR26, and native RMCProfile",
  "retain GAP/QUIP only as the completed single-seed timing and energy-path diagnostic",
  "separate current adapter-smoke evidence from the future stochastic and matched-fit publication comparison",
]

[provenance.amendment_2026_08_03_multiseed_comparison]
reason = "The cross-program ensemble, corrected RMCProfile uncertainty mapping, exact final-coordinate audit, and achieved-fit overlap rule were frozen before ensemble outcomes were generated."
protocol = "expected/multiseed-comparison.toml"
changes = [
  "pass explicit seeds to every implementation",
  "map sigma_S(Q)=0.02 to constant neutron and Q-dependent X-ray F(Q) weights in RMCProfile",
  "require exact 6000-move RMCProfile coordinates through an audited checkpoint-plus-tail procedure",
  "make fixed-budget distributions primary and prohibit matched-fit claims outside overlapping residual support",
]

[system]
formula = "SiO2"
number_density_atoms_per_a3 = 0.06639997054690536
initial_temperature_k = 10000.0
production_temperature_k = 300.0
replicas = 10
seeds = [20260802, 20260803, 20260804, 20260805, 20260806, 20260807, 20260808, 20260809, 20260810, 20260811]

[data.neutron]
enabled = true
normalization = "worked_example_nrtype_5"
epsr_nrtype = 5

[data.xray]
enabled = true
normalization = "single_atom_scattering"

[stages]
order = [
  "randomize_at_10000_k",
  "reference_potential_equilibration",
  "cool_and_equilibrate_at_300_k",
  "empirical_potential_refinement",
  "production_ensemble",
]
match_native_step_counts = true
match_native_atom_count = true
save_native_ensemble = true
save_every_accepted_moves = "set_from_native_input"

[methods.native_epsr]
purpose = "reference implementation"
fit = ["neutron", "xray"]

[methods.rsmith_epsr]
purpose = "reproduction gate before superiority claims"
fit = ["neutron", "xray"]
reference_potential = "exact_native_epsr_convention"

[methods.rsmith_rmc]
purpose = "unregularized control"
fit = ["neutron", "xray"]

[methods.rsmith_pair_hrmc]
purpose = "fixed_pair_potential_control"
fit = ["neutron", "xray"]

[methods.rsmith_mlip_hrmc]
purpose = "proposed method"
fit = ["neutron", "xray"]
implementations = ["gap_quip", "pace_native"]

[comparison.primary_reproduction_gate]
methods = ["native_epsr", "rsmith_epsr"]
matched_data_fit = true
metrics = [
  "neutron_residual",
  "xray_residual",
  "g_SiSi",
  "g_SiO",
  "g_OO",
  "Si_coordination_distribution",
  "O_Si_O_angle_distribution",
  "Si_O_Si_angle_distribution",
  "ring_size_distribution",
]

[comparison.superiority_test]
reference = "native_epsr"
candidate = "rsmith_mlip_hrmc"
matched_data_fit = true
primary_metrics = [
  "held_out_total_scattering",
  "coordination_defect_fraction",
  "angle_distribution_distance",
  "ring_distribution_distance",
]
secondary_metrics = ["wall_time", "acceptance_rate", "seed_variability"]

[comparison.ambient_model_context]
reference_endpoints = ["gap_300K", "pedone_300K"]
role = "secondary model context, not experimental ground truth"
metrics = [
  "g_SiSi",
  "g_SiO",
  "g_OO",
  "Si_coordination_distribution_at_2.2A",
  "O_coordination_distribution_at_2.2A",
  "O_Si_O_angle_distribution",
  "Si_O_Si_angle_distribution",
  "edge_weighted_shortest_ring_distribution",
]
density_policy = "Analyze each endpoint at its native 0-bar model density; report density explicitly and do not rank raw RDF distance across unequal densities without qualification."
claim_rule = "Agreement with GAP or Pedone alone cannot establish physical superiority; held-out scattering and independently defined defect/topology criteria remain primary."

[comparison.next_multiseed_campaign]
protocol = "expected/next-campaign-scope.toml"
methods = ["rsmith_rmc", "rsmith_pair_hrmc", "rsmith_pace_hrmc", "rsmith_epsr", "native_epsr", "native_rmcprofile"]
gap_quip_policy = "archive completed single-seed diagnostic; do not run additional replicas"

[held_out_protocol]
runs = [
  "fit_neutron_predict_xray",
  "fit_xray_predict_neutron",
  "fit_both",
]

[statistics]
report_all_seeds = true
report = ["median", "interquartile_range", "min", "max", "bootstrap_95pct_ci"]
selected_best_run_only = false

[tolerances]
status = "not_yet_frozen"
rule = "Estimate native EPSR seed-to-seed spread, then freeze equivalence margins before running rsmith."
