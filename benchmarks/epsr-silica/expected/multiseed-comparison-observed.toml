[interpretation]
fixed_budget = "PACE weight 3, Pedone weight 3, and pure RMC reach a lower residual range after 6000 moves; fixed-budget values measure direct-refinement progress and throughput, not matched-fit structural superiority. The EPSR arms perform only their first sampling/refinement cycle and are initialization controls, not converged EPSR comparisons."
pace_vs_rmc = "At identical seeds and move budget, PACE weight 3 lowers mean partial-RDF RMS relative to pure RMC in both directions; both paired 95% bootstrap intervals exclude zero."
pace_vs_pedone = "PACE and Pedone weight 3 are unresolved: paired mean partial-RDF RMS intervals include zero in both directions."
external_codes = "No PACE/RMC endpoint overlaps the EPSR26 or RMCProfile achieved-fit range within the preregistered 0.002 tolerance, so superiority over either external program is not supported by this campaign."
epsr_scope = "Native EPSR26 uses niter=1 after resetting its empirical potential; rsmith uses iterations=1, so its updated empirical potential is written only after the scored MC endpoint. The imported tutorial state records nsumt=495, demonstrating the intended iteration scale."
next_gate = "Run native and rsmith EPSR over a convergence schedule approaching the tutorial's iteration scale, retain trajectory checkpoints, and compare hidden structure only at common achieved residuals."

[timing]
scope = "ten independent fresh-process, one-thread scientific runs per method and case; median wall time includes initialization"
qualification = "These ensemble timings are repeated warm-cache implementation measurements. The separately preregistered five cold and five warm timing runs remain incomplete, so do not present these ratios as final publication speed claims."
rmcprofile = "sampling_wall_seconds is the uninterrupted 6000-move stage; exact-coordinate checkpoint-tail bookkeeping is excluded"

[audit]
all_endpoint_counts_complete = true
all_rmcprofile_attempted_moves = 6000
minimum_distance_guard = "All endpoints retain Si-O >= 1.3500 A, O-O >= 2.0056 A, and Si-Si >= 2.0087 A."

